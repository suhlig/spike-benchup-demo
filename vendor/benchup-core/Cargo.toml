[package]
name = "benchup-core"
version = "0.6.6"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
glam = { version = "0.32", features = ["serde"] }
earcutr = "0.5"
uuid = { version = "1", features = ["v4", "js", "serde"] }

[build-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }
